<svg width="620" height="120" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- 彩虹渐变 青→紫→粉→黄 -->
  <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00f0ff"/>
    <stop offset="33%" stop-color="#7b00ff"/>
    <stop offset="66%" stop-color="#ff2bd6"/>
    <stop offset="100%" stop-color="#ffe000"/>
  </linearGradient>
  <!-- 色差色散滤镜 赛博 glitch 效果 -->
  <filter id="ca" x="-20%" y="-20%" width="140%" height="140%">
    <feOffset in="SourceGraphic" dx="-1.5" dy="0" result="r"/>
    <feOffset in="SourceGraphic" dx="1.5" dy="0" result="b"/>
    <feMerge>
      <feMergeNode in="r"/>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="b"/>
    </feMerge>
  </filter>
</defs>
<!-- 深色背景+像素网格 -->
<rect width="100%" height="100%" fill="#080912"/>
<pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse">
  <path d="M6 0 L0 0 L0 6" fill="none" stroke="#101828" stroke-width="0.6"/>
</pattern>
<rect width="100%" height="100%" fill="url(#grid)" />

<!-- 文字，改这里的 YOUR_NAME 为你的名字，像素等宽字体 -->
<text x="310" y="74" text-anchor="middle" font-family="'Courier New',monospace" font-size="46" font-weight="bold" letter-spacing="3" fill="url(#cyberGrad)" filter="url(#ca)" style="image-rendering:pixelated;">Lzcwbcgs</text>
</svg>
