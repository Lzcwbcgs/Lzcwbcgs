<svg xmlns="http://www.w3.org/2000/svg" width="784" height="144" viewBox="0 0 784 144">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="20%" stop-color="#ff6b35"/>
      <stop offset="40%" stop-color="#05d9e8"/>
      <stop offset="60%" stop-color="#7b2dff"/>
      <stop offset="80%" stop-color="#e0fbfc"/>
      <stop offset="100%" stop-color="#ff2a6d"/>
      <!-- 渐变色带横向流动 -->
      <animateTransform attributeName="gradientTransform"
                        type="translate" values="0 0; -1 0; 0 0"
                        dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none" stroke="#1a1a2e" stroke-width="0.5"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="784" height="144" fill="#0a0a12"/>
  <rect width="784" height="144" fill="url(#grid)"/>

  <!-- 像素字：色相轮回 + 发光 + 闪断 -->
  <g filter="url(#glow)">
    <g style="animation: hue 8s linear infinite;">
      <g style="animation: flicker 4s infinite;">

        <!-- L -->
        <rect x="32"  y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="32"  y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="32"  y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="32"  y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="32"  y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="48"  y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="64"  y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="80"  y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="96"  y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- Z -->
        <rect x="128" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="144" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="160" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="176" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="192" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="192" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="160" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="144" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="128" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="144" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="160" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="176" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="192" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- C -->
        <rect x="240" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="256" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="272" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="288" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="224" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="224" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="224" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="240" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="256" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="272" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="288" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- W -->
        <rect x="320" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="384" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="320" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="384" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="320" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="352" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="384" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="320" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="336" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="352" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="368" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="384" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="336" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="368" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- B -->
        <rect x="416" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="432" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="448" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="464" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="480" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="416" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="480" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="416" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="432" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="448" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="464" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="480" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="416" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="480" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="416" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="432" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="448" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="464" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="480" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- C (第二个) -->
        <rect x="528" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="544" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="560" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="576" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="512" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="512" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="512" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="528" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="544" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="560" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="576" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- G -->
        <rect x="624" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="640" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="656" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="672" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="608" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="608" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="640" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="656" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="672" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="608" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="672" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="624" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="640" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="656" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="672" y="96" width="15" height="15" fill="url(#grad)"/>

        <!-- S -->
        <rect x="720" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="736" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="752" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="768" y="32" width="15" height="15" fill="url(#grad)"/>
        <rect x="704" y="48" width="15" height="15" fill="url(#grad)"/>
        <rect x="720" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="736" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="752" y="64" width="15" height="15" fill="url(#grad)"/>
        <rect x="768" y="80" width="15" height="15" fill="url(#grad)"/>
        <rect x="704" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="720" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="736" y="96" width="15" height="15" fill="url(#grad)"/>
        <rect x="752" y="96" width="15" height="15" fill="url(#grad)"/>

      </g>
    </g>
  </g>

  <!-- 扫描线覆盖 -->
  <rect width="784" height="144" fill="url(#scan)">
    <animateTransform attributeName="transform" type="translate"
                      values="0,-144; 0,144" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <style>
    @keyframes hue {
      0%   { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    @keyframes flicker {
      0%,   100% { opacity: 1; }
      2%         { opacity: 0.75; }
      4%         { opacity: 1; }
      50%        { opacity: 1; }
      51%        { opacity: 0.6; }
      52%        { opacity: 1; }
      74%        { opacity: 1; }
      75%        { opacity: 0.8; }
      76%        { opacity: 1; }
    }
  </style>
</svg>
